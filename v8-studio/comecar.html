<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Começar — V8 Studio</title>
<meta name="description" content="Responda 8 perguntas rápidas e receba uma recomendação de site, landing page, loja virtual, sistema ou aplicativo para o seu negócio. Leva 2 minutos, sem compromisso.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<style>
/* ---------- Página Começar: formulário em etapas ---------- */
.quiz-section { padding-block: 56px 96px; min-height: calc(100vh - var(--header-h)); }
.quiz-wrap { max-width: 880px; margin-inline: auto; }
.quiz__intro { text-align: center; color: var(--color-gray); font-weight: 500; margin-bottom: 20px; }
.quiz__note { text-align: center; margin-top: 20px; }
.quiz { padding: 48px; }

.quiz__top { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
.quiz__top .progress { flex: 1; min-width: 0; }
.quiz__count { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--color-gray); font-size: var(--text-sm); font-weight: 500; }

.quiz__stage { display: grid; position: relative; transition: height 420ms cubic-bezier(0.22, 1, 0.36, 1); }
.screen { grid-area: 1 / 1; min-width: 0; transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1), opacity 420ms cubic-bezier(0.22, 1, 0.36, 1); }
.screen.from-right { transform: translateX(56px); opacity: 0; }
.screen.from-left { transform: translateX(-56px); opacity: 0; }
.screen.to-left { transform: translateX(-56px); opacity: 0; pointer-events: none; }
.screen.to-right { transform: translateX(56px); opacity: 0; pointer-events: none; }
.screen h2 { font-size: clamp(32px, 4.2vw, 46px); max-width: 18ch; }
.screen h2:focus { outline: none; }
.screen h2:focus-visible { outline: 3px solid var(--color-blue); outline-offset: 6px; }

.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 32px; }
.options--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.options > * { min-width: 0; }
.options--3 .option { padding: 22px 22px; }
.options--3 .option strong { font-size: 18px; }
.option strong { text-wrap: balance; }

.screen__actions { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.screen__actions .btn--quiet { margin-left: -8px; }
.screen__actions .btn--quiet svg { width: 16px; height: 16px; }

/* Contato */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 20px; margin-top: 32px; }
.form-grid > * { min-width: 0; }
.form-grid .field--full { grid-column: 1 / -1; }
.field.is-error input { border-color: var(--color-bad); }
.field.is-error input:focus { box-shadow: 0 0 0 4px rgba(200,50,59,0.14); }
.field__hint--error { color: var(--color-bad); }
.field__hint:empty { display: none; }
.form-grid .check { grid-column: 1 / -1; margin-top: 4px; }
.check a { color: var(--color-blue); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.form-hint { font-size: var(--text-xs); color: var(--color-gray); }

/* Resultado */
.result { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; align-items: center; margin-top: 32px; }
.ring { width: 180px; height: 180px; position: relative; margin-inline: auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 10; }
.ring__bg { stroke: var(--color-line); }
.ring__arc { stroke: var(--color-blue); stroke-linecap: round; }
.ring__value { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 44px; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.ring__value small { font-size: 22px; letter-spacing: -0.01em; margin-left: 2px; }
.ring__label { text-align: center; margin-top: 12px; font-size: var(--text-sm); color: var(--color-gray); font-weight: 500; }
.result__text { display: grid; gap: 14px; }
.result__text p { color: var(--color-gray); }
.result__sla { font-weight: 600; color: var(--color-ink) !important; }

@media (max-width: 1024px) {
  .options--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .quiz-section { padding-block: 32px 64px; min-height: 0; }
  .quiz { padding: 28px 22px; }
  .quiz__top { margin-bottom: 28px; gap: 14px; }
  .screen h2 { font-size: 30px; }
  .options, .options--3 { grid-template-columns: 1fr; gap: 12px; margin-top: 24px; }
  .option, .options--3 .option { padding: 18px 20px; }
  .option strong { font-size: 18px; }
  .form-grid { grid-template-columns: 1fr; margin-top: 24px; }
  .result { grid-template-columns: 1fr; gap: 28px; text-align: center; }
  .result__text { text-align: left; }

  /* Botão principal fixo no rodapé da tela (contato e resultado) */
  .screen--cta .screen__cta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
    background: var(--color-white); border-top: 1px solid var(--color-line);
    opacity: 0; transition: opacity 240ms ease;
  }
  .screen--cta.is-settled .screen__cta { opacity: 1; }
  .screen__cta .btn { width: 100%; }
  body.has-fixed-cta { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

@media (prefers-reduced-motion: reduce) {
  .quiz__stage { transition: none; }
  .screen { transition: opacity 220ms ease; }
  .screen.from-right, .screen.from-left, .screen.to-left, .screen.to-right { transform: none; }
  .screen--cta .screen__cta { transition: none; }
}
</style>
</head>
<body>
<div data-header></div>
<main>
  <section class="section paper quiz-section">
    <div class="container">
      <div class="quiz-wrap">
        <h1 class="visually-hidden">Começar um projeto com a V8 Studio</h1>
        <p class="quiz__intro">Leva 2 minutos. Sem compromisso.</p>
        <div class="card card--pad-lg quiz" id="quiz">
          <div class="quiz__top">
            <div class="progress" role="progressbar" aria-label="Progresso do formulário" aria-valuemin="0" aria-valuemax="8" aria-valuenow="1"><div class="progress__bar" id="quiz-bar" style="width:12.5%"></div></div>
            <p class="quiz__count" id="quiz-count" aria-live="polite">Pergunta 1 de 8</p>
          </div>
          <div class="quiz__stage" id="quiz-stage"></div>
        </div>
        <p class="quiz__note small muted">Suas respostas servem só para montar a proposta.</p>
      </div>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="assets/app.js" data-root="" defer></script>
<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR = reduce ? 220 : 420;

  /* ---------- Perguntas, opções e frases de retorno ---------- */
  var Q = [
    { id: "need", title: "O que você precisa hoje?", opts: [
      { v: "site", t: "Site institucional", d: "Apresenta a empresa com confiança", e: "Site institucional é a base de tudo. Vamos acertar o resto." },
      { v: "landing", t: "Landing page", d: "Uma página focada em converter", e: "Boa. Landing page é o nosso forte." },
      { v: "loja", t: "Loja virtual", d: "Catálogo, carrinho e pagamento", e: "Loja virtual, então. Vamos falar de venda." },
      { v: "sistema", t: "Sistema web", d: "Painéis, cadastros e processos", e: "Sistema web. Vamos entender o que precisa rodar." },
      { v: "app", t: "Aplicativo", d: "Para iOS e Android, com login", e: "Aplicativo. Vamos ver o que ele precisa fazer." },
      { v: "naosei", t: "Ainda não sei", d: "A gente descobre junto", e: "Sem problema. A gente descobre junto." }
    ] },
    { id: "site", title: "Já tem site?", opts: [
      { v: "nao", t: "Não tenho", d: "Vamos começar do zero", e: "Começar do zero é mais simples do que parece." },
      { v: "naogera", t: "Tenho, mas não gera clientes", d: "Existe, mas não traz resultado", e: "Isso é mais comum do que você imagina. Dá para resolver." },
      { v: "evoluir", t: "Tenho e quero evoluir", d: "Funciona, mas pode render mais", e: "Ótimo ponto de partida. Evoluir é mais rápido do que refazer." }
    ] },
    { id: "objetivo", title: "Qual o objetivo?", opts: [
      { v: "contatos", t: "Gerar contatos", d: "Mais pedidos de orçamento", e: "Contatos. Então cada página precisa pedir o próximo passo." },
      { v: "vender", t: "Vender online", d: "Fechar vendas direto pelo site", e: "Vender online. O caminho até o pagamento precisa ser curto." },
      { v: "credibilidade", t: "Passar credibilidade", d: "Parecer tão bom quanto você é", e: "Credibilidade se constrói nos detalhes. É aí que a gente entra." },
      { v: "operacao", t: "Organizar a operação", d: "Menos planilha, mais controle", e: "Organizar a operação muda a rotina da empresa. Bom objetivo." }
    ] },
    { id: "segmento", title: "Qual o seu segmento?", cols: 3, opts: [
      { v: "saude", t: "Saúde", d: "Clínicas e consultórios", e: "Saúde. Agendamento fácil e confiança no primeiro clique." },
      { v: "advocacia", t: "Advocacia", d: "Escritórios e advogados", e: "Advocacia. Clareza e autoridade, sem exagero." },
      { v: "alimentacao", t: "Alimentação", d: "Restaurantes e delivery", e: "Alimentação. Cardápio na mão e pedido em dois toques." },
      { v: "imobiliario", t: "Imobiliário", d: "Imóveis e corretores", e: "Imobiliário. Busca rápida e contato direto com o corretor." },
      { v: "fitness", t: "Fitness", d: "Academias e estúdios", e: "Fitness. Matrícula sem fricção e aula experimental em destaque." },
      { v: "arquitetura", t: "Arquitetura e design", d: "Escritórios e designers", e: "Arquitetura e design. O portfólio precisa falar por você." },
      { v: "varejo", t: "Varejo e moda", d: "Lojas e marcas de roupa", e: "Varejo e moda. Produto bem mostrado vende mais." },
      { v: "servicos", t: "Serviços e consultoria", d: "Agências e consultores", e: "Serviços e consultoria. Mostrar método é o que gera confiança." },
      { v: "educacao", t: "Educação", d: "Escolas, cursos e professores", e: "Educação. Matrícula simples e conteúdo bem organizado." }
    ] },
    { id: "prazo", title: "Para quando?", opts: [
      { v: "ontem", t: "Para ontem", d: "Preciso o quanto antes", e: "Para ontem a gente entende. Vamos priorizar o essencial." },
      { v: "30", t: "Em até 30 dias", d: "Tenho uma data próxima", e: "Trinta dias é um prazo bom para uma entrega enxuta." },
      { v: "90", t: "Em até 90 dias", d: "Dá para planejar com calma", e: "Noventa dias dá espaço para fazer com calma e testar." },
      { v: "sempressa", t: "Sem pressa", d: "Quero fazer bem feito", e: "Sem pressa é bom. Dá para fazer bem feito desde o começo." }
    ] },
    { id: "faixa", title: "Faixa de investimento", opts: [
      { v: "ate3", t: "Até R$ 3 mil", d: "Para começar com o essencial", e: "Com esse valor, o foco é fazer o essencial muito bem." },
      { v: "3a6", t: "R$ 3 a 6 mil", d: "Página ou site enxuto", e: "Faixa boa para uma entrega enxuta e com qualidade." },
      { v: "6a12", t: "R$ 6 a 12 mil", d: "Site completo ou loja", e: "Nessa faixa cabe um projeto completo." },
      { v: "12a25", t: "R$ 12 a 25 mil", d: "Sistema ou app mais simples", e: "Aqui já dá para pensar em algo sob medida." },
      { v: "mais25", t: "Acima de R$ 25 mil", d: "Projetos maiores, sob medida", e: "Projeto grande. Vamos tratar com o cuidado que merece." },
      { v: "proposta", t: "Prefiro ouvir uma proposta", d: "Sem faixa definida ainda", e: "Tudo bem. A gente monta a proposta e você decide." }
    ] },
    { id: "quem", title: "Você é...", opts: [
      { v: "dono", t: "Dono do negócio", d: "Decido e acompanho de perto", e: "Falar direto com quem decide acelera tudo." },
      { v: "socio", t: "Sócio ou gestor", d: "Participo das decisões", e: "Ótimo. Vamos deixar tudo claro para você apresentar." },
      { v: "marketing", t: "Marketing da empresa", d: "Cuido da comunicação", e: "Marketing a bordo. Vamos falar a mesma língua." },
      { v: "agencia", t: "Agência ou parceiro", d: "Busco um parceiro de produção", e: "Parceria é bem-vinda. Trabalhamos bem nos bastidores." }
    ] }
  ];
  var CONTACT = Q.length;          // índice da tela de contato (7)
  var RESULT = Q.length + 1;       // índice da tela de resultado (8)
  var TOTAL = Q.length + 1;        // 8 perguntas na barra

  /* ---------- Textos do resultado ---------- */
  var SERVICE_PHRASE = {
    site: "um site institucional com páginas de serviço e contato",
    landing: "uma landing page com formulário de qualificação",
    loja: "uma loja virtual com checkout simples e pagamento integrado",
    sistema: "um sistema web com painel e cadastros",
    app: "um aplicativo com login e notificações"
  };
  var FALLBACK_SERVICE = { contatos: "landing", vender: "loja", credibilidade: "site", operacao: "sistema" };
  var OBJ_PHRASE = { contatos: "gerar contatos", vender: "vender online", credibilidade: "passar credibilidade", operacao: "organizar a operação" };
  var PRAZO_PHRASE = { ontem: "o quanto antes", "30": "em até 30 dias", "90": "em até 90 dias", sempressa: "no seu tempo" };
  var PRAZO_END = { ontem: "é o caminho mais rápido", "30": "é o caminho mais rápido", "90": "é o caminho mais seguro", sempressa: "é o caminho certo" };
  var SEG_PHRASE = {
    saude: ["uma clínica", "agendamento e credibilidade"],
    advocacia: ["um escritório de advocacia", "autoridade e contato rápido"],
    alimentacao: ["um negócio de alimentação", "cardápio claro e pedido fácil"],
    imobiliario: ["o mercado imobiliário", "busca de imóveis e contato com o corretor"],
    fitness: ["uma academia ou estúdio", "matrícula e aula experimental"],
    arquitetura: ["um escritório de arquitetura", "portfólio e pedido de orçamento"],
    varejo: ["varejo e moda", "vitrine de produtos e compra sem atrito"],
    servicos: ["serviços e consultoria", "método claro e prova de resultado"],
    educacao: ["educação", "matrícula simples e conteúdo organizado"]
  };
  var FAIXA_PHRASE = {
    ate3: "Com a faixa escolhida, cabe página, copy e integração com WhatsApp.",
    "3a6": "Com a faixa escolhida, cabe página, copy, integração com WhatsApp e medição de resultados.",
    "6a12": "Com a faixa escolhida, cabe projeto completo, copy, integrações e acompanhamento no primeiro mês.",
    "12a25": "Com a faixa escolhida, cabe projeto sob medida, integrações e acompanhamento nos primeiros meses.",
    mais25: "Com a faixa escolhida, cabe projeto sob medida, integrações, conteúdo e acompanhamento contínuo.",
    proposta: "Sem faixa definida, a gente monta a proposta com o que faz sentido e você escolhe o tamanho."
  };

  /* ---------- Estado ---------- */
  var answers = {};
  var step = 0;
  var moving = false;
  var stage = document.getElementById("quiz-stage");
  var bar = document.getElementById("quiz-bar");
  var count = document.getElementById("quiz-count");
  var progress = document.querySelector(".progress");
  var card = document.getElementById("quiz");
  var ICON_BACK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 10H4M9 5l-5 5 5 5"/></svg>';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function findOpt(q, v) { for (var i = 0; i < q.opts.length; i++) if (q.opts[i].v === v) return q.opts[i]; return null; }
  function echoFor(index) {
    if (index === 0) return "Vamos montar a sua proposta.";
    var q = Q[index - 1], o = findOpt(q, answers[q.id]);
    return o ? o.e : "";
  }

  /* ---------- Telas ---------- */
  function buildQuestion(i) {
    var q = Q[i];
    var html = '<section class="screen" data-step="' + i + '">' +
      '<p class="kicker">' + esc(echoFor(i)) + '</p>' +
      '<h2 tabindex="-1">' + esc(q.title) + '</h2>' +
      '<div class="options' + (q.cols === 3 ? " options--3" : "") + '" role="group" aria-label="' + esc(q.title) + '">';
    q.opts.forEach(function (o) {
      var sel = answers[q.id] === o.v;
      html += '<button class="option' + (sel ? " is-selected" : "") + '" type="button" data-value="' + esc(o.v) + '" aria-pressed="' + (sel ? "true" : "false") + '">' +
        '<strong>' + esc(o.t) + '</strong><span>' + esc(o.d) + '</span></button>';
    });
    html += '</div>';
    if (i > 0) html += '<div class="screen__actions"><button class="btn btn--quiet" type="button" data-back>' + ICON_BACK + 'Voltar</button></div>';
    html += '</section>';
    var s = el(html);
    s.querySelectorAll(".option").forEach(function (b) {
      b.addEventListener("click", function () {
        if (moving) return;
        answers[q.id] = b.dataset.value;
        s.querySelectorAll(".option").forEach(function (x) { x.classList.toggle("is-selected", x === b); x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        show(i + 1, "fwd");
      });
    });
    var back = s.querySelector("[data-back]");
    if (back) back.addEventListener("click", function () { if (!moving) show(i - 1, "back"); });
    return s;
  }

  function buildContact() {
    var html = '<section class="screen screen--cta" data-step="' + CONTACT + '">' +
      '<p class="kicker">' + esc(echoFor(CONTACT)) + '</p>' +
      '<h2 tabindex="-1">Para onde a gente manda o resultado?</h2>' +
      '<form class="form-grid" data-demo novalidate autocomplete="on">' +
        '<div class="field field--full"><label for="c-nome">Nome</label><input id="c-nome" name="nome" type="text" autocomplete="name" placeholder="Como podemos te chamar" required><p class="field__hint" id="c-nome-hint" aria-live="polite"></p></div>' +
        '<div class="field"><label for="c-zap">WhatsApp</label><input id="c-zap" name="whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(11) 91234-5678" required><p class="field__hint" id="c-zap-hint" aria-live="polite"></p></div>' +
        '<div class="field"><label for="c-email">E-mail</label><input id="c-email" name="email" type="email" autocomplete="email" placeholder="nome@empresa.com.br" required><p class="field__hint" id="c-email-hint" aria-live="polite"></p></div>' +
        '<label class="check"><input type="checkbox" id="c-aceite" name="aceite" required><span>Li e aceito a <a href="privacidade.html">política de privacidade</a>.</span></label>' +
        '<div class="screen__actions field--full">' +
          '<button class="btn btn--quiet" type="button" data-back>' + ICON_BACK + 'Voltar</button>' +
          '<div class="screen__cta"><button class="btn btn--primary" type="submit" id="c-submit" disabled>Ver meu resultado</button></div>' +
        '</div>' +
      '</form>' +
    '</section>';
    var s = el(html);
    var form = s.querySelector("form");
    var nome = s.querySelector("#c-nome"), zap = s.querySelector("#c-zap"), email = s.querySelector("#c-email"), aceite = s.querySelector("#c-aceite"), submit = s.querySelector("#c-submit");
    var touched = {};

    function digits(v) { return v.replace(/\D/g, "").slice(0, 11); }
    function fmtPhone(d) {
      if (!d.length) return "";
      if (d.length < 3) return "(" + d;
      var rest = d.slice(2);
      var tail = rest.length > 5 ? rest.slice(0, 5) + "-" + rest.slice(5) : rest;
      return "(" + d.slice(0, 2) + ") " + tail;
    }
    var rules = {
      nome: { input: nome, ok: function () { return nome.value.trim().length >= 2; }, msg: "Digite seu nome para a gente saber com quem fala." },
      zap: { input: zap, ok: function () { return digits(zap.value).length === 11; }, msg: "Digite o WhatsApp com DDD, como (11) 91234-5678." },
      email: { input: email, ok: function () { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim()); }, msg: "Digite um e-mail válido, como nome@empresa.com.br." }
    };
    function paint(key) {
      var r = rules[key], field = r.input.closest(".field"), hint = field.querySelector(".field__hint");
      var bad = touched[key] && !r.ok();
      field.classList.toggle("is-error", !!bad);
      hint.textContent = bad ? r.msg : "";
      hint.classList.toggle("field__hint--error", !!bad);
      r.input.setAttribute("aria-invalid", bad ? "true" : "false");
      if (bad) r.input.setAttribute("aria-describedby", hint.id); else r.input.removeAttribute("aria-describedby");
    }
    function allOk() { return rules.nome.ok() && rules.zap.ok() && rules.email.ok() && aceite.checked; }
    function refresh() { submit.disabled = !allOk(); }

    Object.keys(rules).forEach(function (key) {
      var inp = rules[key].input;
      inp.addEventListener("blur", function () { if (inp.value.trim()) touched[key] = true; paint(key); refresh(); });
      inp.addEventListener("input", function () { if (rules[key].ok()) touched[key] = touched[key] && false; paint(key); refresh(); });
    });
    zap.addEventListener("input", function () {
      var d = digits(zap.value), v = fmtPhone(d);
      if (zap.value !== v) { zap.value = v; try { zap.setSelectionRange(v.length, v.length); } catch (e) {} }
      if (d.length === 11) touched.zap = false;
      paint("zap"); refresh();
    });
    aceite.addEventListener("change", refresh);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      Object.keys(rules).forEach(function (key) { touched[key] = true; paint(key); });
      refresh();
      if (!allOk()) {
        var first = Object.keys(rules).filter(function (k) { return !rules[k].ok(); })[0];
        if (first) rules[first].input.focus();
        return;
      }
      answers.nome = nome.value.trim();
      answers.whatsapp = zap.value;
      answers.email = email.value.trim();
      answers.aceite = true;
      answers.score = score(answers);
      try { sessionStorage.setItem("v8-comecar", JSON.stringify(answers)); } catch (err) {}
      show(RESULT, "fwd");
    });
    s.querySelector("[data-back]").addEventListener("click", function () { if (!moving) show(CONTACT - 1, "back"); });
    return s;
  }

  function score(a) {
    var s = 86;
    var fit = { landing: "contatos", loja: "vender", site: "credibilidade", sistema: "operacao", app: "operacao" };
    if (a.need === "naosei") s -= 4; else if (fit[a.need] !== a.objetivo) s -= 3;
    if (a.prazo === "ontem") s -= 3;
    if (a.prazo === "sempressa") s += 2;
    var big = a.need === "sistema" || a.need === "app";
    if (big && (a.faixa === "ate3" || a.faixa === "3a6")) s -= 6;
    if (big && a.faixa === "mais25") s += 3;
    if (a.faixa === "proposta") s -= 1;
    if (a.site === "evoluir") s += 2;
    if (a.site === "naogera") s += 1;
    return Math.max(78, Math.min(94, s));
  }

  function firstName(n) {
    var f = (n || "").trim().split(/\s+/)[0] || "";
    return f ? f.charAt(0).toUpperCase() + f.slice(1) : "";
  }
  function recommendation(a) {
    var need = a.need === "naosei" ? (FALLBACK_SERVICE[a.objetivo] || "site") : a.need;
    var l1 = "Para " + OBJ_PHRASE[a.objetivo] + " " + PRAZO_PHRASE[a.prazo] + ", " + SERVICE_PHRASE[need] + " " + PRAZO_END[a.prazo] + ".";
    var seg = SEG_PHRASE[a.segmento] || ["o seu negócio", "clareza e contato fácil"];
    var l2 = "Para " + seg[0] + ", o foco é " + seg[1] + ".";
    var l3 = FAIXA_PHRASE[a.faixa] || FAIXA_PHRASE.proposta;
    return [l1, l2, l3];
  }

  function buildResult() {
    var pct = answers.score || 86;
    var name = firstName(answers.nome);
    var lines = recommendation(answers);
    var C = 2 * Math.PI * 52;
    var html = '<section class="screen screen--cta screen--result" data-step="' + RESULT + '">' +
      '<p class="kicker">Pronto. Aqui está o que faz sentido para você.</p>' +
      '<h2 tabindex="-1">Boa notícia' + (name ? ", " + esc(name) : "") + '.</h2>' +
      '<div class="result">' +
        '<div>' +
          '<div class="ring" role="img" aria-label="Compatibilidade ' + pct + ' por cento">' +
            '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring__bg" cx="60" cy="60" r="52"/><circle class="ring__arc" cx="60" cy="60" r="52" style="stroke-dasharray:' + C + ';stroke-dashoffset:' + C + '"/></svg>' +
            '<div class="ring__value" aria-hidden="true"><span><b class="ring__num">0</b><small>%</small></span></div>' +
          '</div>' +
          '<p class="ring__label">Compatibilidade</p>' +
        '</div>' +
        '<div class="result__text">' +
          lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join("") +
          '<p class="result__sla">Respondemos em até 1 dia útil.</p>' +
        '</div>' +
      '</div>' +
      '<div class="screen__actions"><div class="screen__cta"><a class="btn btn--primary" href="index.html">Voltar ao início</a></div></div>' +
    '</section>';
    var s = el(html);
    s._animate = function () {
      var arc = s.querySelector(".ring__arc"), num = s.querySelector(".ring__num");
      if (reduce) { arc.style.strokeDashoffset = C * (1 - pct / 100); num.textContent = pct; return; }
      var start = null, dur = 1500;
      function tick(t) {
        if (!start) start = t;
        var p = Math.min(1, (t - start) / dur); p = 1 - Math.pow(1 - p, 3);
        arc.style.strokeDashoffset = C * (1 - (pct * p) / 100);
        num.textContent = Math.round(pct * p);
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    };
    return s;
  }

  function build(index) {
    if (index < CONTACT) return buildQuestion(index);
    if (index === CONTACT) return buildContact();
    return buildResult();
  }

  /* ---------- Progresso ---------- */
  function setProgress(index) {
    var n = Math.min(index + 1, TOTAL);
    var pct = index >= RESULT ? 100 : (n / TOTAL) * 100;
    bar.style.width = pct + "%";
    progress.setAttribute("aria-valuenow", String(index >= RESULT ? TOTAL : n));
    count.textContent = index >= RESULT ? "Resultado" : "Pergunta " + n + " de " + TOTAL;
  }

  /* ---------- Troca de tela ---------- */
  function headerH() {
    var v = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--header-h"), 10);
    return isNaN(v) ? 76 : v;
  }
  function settle(s) {
    s.classList.add("is-settled");
    document.body.classList.toggle("has-fixed-cta", s.classList.contains("screen--cta"));
    if (s._animate) s._animate();
  }
  function focusTitle(s) {
    var h = s.querySelector("h2");
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
    var top = card.getBoundingClientRect().top;
    if (top < headerH()) window.scrollTo({ top: window.scrollY + top - headerH() - 16, behavior: reduce ? "auto" : "smooth" });
  }

  function show(index, dir) {
    var old = stage.querySelector(".screen");
    var next = build(index);
    step = index;
    setProgress(index);
    document.body.classList.remove("has-fixed-cta");

    if (!old) {
      stage.appendChild(next);
      settle(next);
      return;
    }
    moving = true;
    var h0 = stage.offsetHeight;
    stage.style.height = h0 + "px";
    next.classList.add(dir === "back" ? "from-left" : "from-right");
    stage.appendChild(next);
    var h1 = next.offsetHeight;
    focusTitle(next);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        old.classList.add(dir === "back" ? "to-right" : "to-left");
        next.classList.remove("from-left", "from-right");
        stage.style.height = h1 + "px";
      });
    });
    setTimeout(function () {
      old.remove();
      stage.style.height = "";
      moving = false;
      settle(next);
    }, DUR + 40);
  }

  /* ---------- Início: ?servico= pré-seleciona a pergunta 1 ---------- */
  var startAt = 0;
  try {
    var params = new URLSearchParams(window.location.search || "");
    var svc = params.get("servico");
    var map = { "landing-pages": "landing", sites: "site", "lojas-virtuais": "loja", sistemas: "sistema", aplicativos: "app" };
    if (svc && map[svc]) { answers.need = map[svc]; startAt = 1; }
  } catch (e) {}
  show(startAt, "fwd");
})();
</script>
</body></html>
