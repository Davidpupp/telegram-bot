<style>
/* Layout comum do painel */
.admin__side .logo { padding: 4px 10px; }
.admin__nav { display: grid; gap: 4px; }
.admin__nav a svg { flex: 0 0 auto; }
.admin__nav hr { border: 0; height: 1px; background: var(--color-line); margin: 10px 14px; }
.admin__top h1 { font-size: 36px; }
.admin__top .row { gap: 12px; }
.admin .card h3 { font-size: 22px; margin-bottom: 18px; }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.card__head h3 { margin-bottom: 0 !important; }
.admin .card--flush { padding: 0; }
.admin .card--flush .card__head { padding: 24px 32px 0; margin-bottom: 8px; }
.card--flush .table-wrap { box-shadow: none; border-radius: 0; }
.g8 { grid-column: span 8; } .g4 { grid-column: span 4; } .g6 { grid-column: span 6; } .g12 { grid-column: 1 / -1; }
.notice { display: none; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--color-ok); font-weight: 500; }
.notice.is-on { display: inline-flex; }
.notice::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); }
.link { color: var(--color-blue); font-weight: 600; }
.link:hover { text-decoration: underline; }
@media (max-width: 1024px) {
  .admin__side { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
  .admin__nav { flex: 1 0 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .admin__nav::-webkit-scrollbar { display: none; }
  .admin__nav a { padding: 8px 12px; white-space: nowrap; font-size: var(--text-xs); }
  .admin__nav hr { display: none; }
  .admin__top h1 { font-size: 30px; }
  .g8, .g4, .g6 { grid-column: 1 / -1; }
  .admin .card--flush .card__head { padding: 22px 24px 0; }
}
@media (max-width: 720px) { .admin .card { padding: 24px; } .kpis { gap: 16px; } .kpi { padding: 22px 24px; } .kpi .stat__n { font-size: 40px; } }
.kpis { margin-bottom: var(--gutter); }
.kpi .stat__n { font-size: 48px; }
.bars { display: grid; gap: 16px; }
.bar { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 12px; font-size: var(--text-sm); }
.bar__track { height: 10px; border-radius: 5px; background: var(--color-line); overflow: hidden; }
.bar__fill { height: 100%; width: 0; background: var(--color-blue); border-radius: 5px; transition: width 640ms var(--ease-out); }
.bar__n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars__total { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-line); font-size: var(--text-sm); color: var(--color-gray); }
.lead-cell a { color: var(--color-ink); font-weight: 600; } .lead-cell a:hover { color: var(--color-blue); }
.lead-cell span { display: block; font-size: var(--text-xs); color: var(--color-gray); font-weight: 400; }
</style>

var SERVICOS = ["Site", "Landing page", "Loja virtual", "Sistema", "Aplicativo"];
var PERGUNTAS = ["O que você precisa?", "Qual é o seu segmento?", "Qual é o principal objetivo?", "Você já tem site ou sistema hoje?", "Para quando precisa?", "Qual faixa de investimento?", "Qual é o seu papel na empresa?"];

function fmtData(iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }

function scoreHtml(n) { return '<span class="score"><b>' + n + '</b><i style="--v:' + n + '%"></i></span>'; }
function statusHtml(s) { return '<span class="status status--' + s + '">' + STATUS[s] + '</span>'; }

  var mes = "2026-10";
  var noMes = LEADS.filter(function (l) { return l.data.indexOf(mes) === 0; });
  var media = Math.round(LEADS.reduce(function (s, l) { return s + l.pontos; }, 0) / LEADS.length);

  document.getElementById("kpi-propostas").textContent = LEADS.filter(function (l) { return l.status === "proposta"; }).length;
  document.getElementById("kpi-fechados").textContent = noMes.filter(function (l) { return l.status === "fechado"; }).length;

  var recentes = LEADS.slice().sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : a.id - b.id; }).slice(0, 6);

  }).join("");

  var bars = document.getElementById("bars");
  var max = 0, counts = SERVICOS.map(function (s) { var n = LEADS.filter(function (l) { return l.servico === s; }).length; if (n > max) max = n; return [s, n]; });

});
