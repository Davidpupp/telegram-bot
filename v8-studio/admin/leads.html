<style>
/* Layout comum do painel */
.admin__side .logo { padding: 4px 10px; }
.admin__nav { display: grid; gap: 4px; }
.admin__nav a svg { flex: 0 0 auto; }
.admin__nav hr { border: 0; height: 1px; background: var(--color-line); margin: 10px 14px; }
.admin__top h1 { font-size: 36px; }
.admin__top .row { gap: 12px; }
.admin .card h3 { font-size: 22px; margin-bottom: 18px; }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.card__head h3 { margin-bottom: 0 !important; }
.admin .card--flush { padding: 0; }
.admin .card--flush .card__head { padding: 24px 32px 0; margin-bottom: 8px; }
.card--flush .table-wrap { box-shadow: none; border-radius: 0; }
.g8 { grid-column: span 8; } .g4 { grid-column: span 4; } .g6 { grid-column: span 6; } .g12 { grid-column: 1 / -1; }
.notice { display: none; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--color-ok); font-weight: 500; }
.notice.is-on { display: inline-flex; }
.notice::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); }
.link { color: var(--color-blue); font-weight: 600; }
.link:hover { text-decoration: underline; }
@media (max-width: 1024px) {
  .admin__side { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
  .admin__nav { flex: 1 0 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .admin__nav::-webkit-scrollbar { display: none; }
  .admin__nav a { padding: 8px 12px; white-space: nowrap; font-size: var(--text-xs); }
  .admin__nav hr { display: none; }
  .admin__top h1 { font-size: 30px; }
  .g8, .g4, .g6 { grid-column: 1 / -1; }
  .admin .card--flush .card__head { padding: 22px 24px 0; }
}
@media (max-width: 720px) { .admin .card { padding: 24px; } .kpis { gap: 16px; } .kpi { padding: 22px 24px; } .kpi .stat__n { font-size: 40px; } }
.filters-card { margin-bottom: var(--gutter); }
.filters .field { min-width: 160px; flex: 1 1 160px; }
.filters .field--busca { flex: 2 1 220px; }
.filters label { font-size: var(--text-xs); color: var(--color-gray); margin-bottom: 6px; }
.filters select, .filters input { padding-inline: 16px; }
.count { color: var(--color-gray); font-size: var(--text-sm); font-weight: 500; }
.lead-cell a { color: var(--color-ink); font-weight: 600; } .lead-cell a:hover { color: var(--color-blue); }
.lead-cell span { display: block; font-size: var(--text-xs); color: var(--color-gray); font-weight: 400; }
.empty { display: none; padding: 56px 24px; text-align: center; }
.empty.is-on { display: grid; justify-items: center; gap: 16px; }
.empty p { color: var(--color-gray); }
</style>

var STATUS = { novo: "Novo", contato: "Em contato", proposta: "Proposta enviada", fechado: "Fechado", perdido: "Perdido" };
var SERVICOS = ["Site", "Landing page", "Loja virtual", "Sistema", "Aplicativo"];
var PERGUNTAS = ["O que você precisa?", "Qual é o seu segmento?", "Qual é o principal objetivo?", "Você já tem site ou sistema hoje?", "Para quando precisa?", "Qual faixa de investimento?", "Qual é o seu papel na empresa?"];
function respostas(l) { return [l.servico, l.segmento, l.objetivo, l.atual, l.prazo, l.faixa, l.papel]; }
function fmtData(iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function scoreHtml(n) { return '<span class="score"><b>' + n + '</b><i style="--v:' + n + '%"></i></span>'; }
function statusHtml(s) { return '<span class="status status--' + s + '">' + STATUS[s] + '</span>'; }
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  document.querySelectorAll("a.logo").forEach(function (a) { a.innerHTML = window.V8.logoSvg("", null) + "<span>Studio</span>"; });
  var tbody = document.getElementById("linhas");
  var ordenados = LEADS.slice().sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : a.id - b.id; });
  tbody.innerHTML = ordenados.map(function (l) {
    return "<tr data-id=\"" + l.id + "\" data-status=\"" + l.status + "\" data-servico=\"" + esc(l.servico) + "\" data-pontos=\"" + l.pontos + "\" data-busca=\"" + esc((l.nome + " " + l.empresa).toLowerCase()) + "\">" +
      "<td class=\"lead-cell\"><a href=\"lead.html?id=" + l.id + "\">" + esc(l.nome) + "</a><span>" + esc(l.empresa) + "</span></td>" +
      "<td>" + esc(l.servico) + "</td><td>" + esc(l.segmento) + "</td><td>" + scoreHtml(l.pontos) + "</td><td>" + statusHtml(l.status) + "</td><td class=\"muted\">" + fmtData(l.data) + "</td>" +
      "<td><a href=\"lead.html?id=" + l.id + "\">Abrir</a></td></tr>";
  }).join("");

  var fStatus = document.getElementById("f-status"), fServico = document.getElementById("f-servico"), fMin = document.getElementById("f-min"), fBusca = document.getElementById("f-busca");
  var contador = document.getElementById("contador"), vazio = document.getElementById("vazio"), tabela = document.getElementById("tabela");
  function normal(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function filtrar() {
    var st = fStatus.value, sv = fServico.value, min = parseInt(fMin.value, 10) || 0, q = normal(fBusca.value.trim());
    var n = 0;
    tbody.querySelectorAll("tr").forEach(function (tr) {
      var ok = (!st || tr.dataset.status === st) && (!sv || tr.dataset.servico === sv) && parseInt(tr.dataset.pontos, 10) >= min && (!q || normal(tr.dataset.busca).indexOf(q) !== -1);
      tr.hidden = !ok; if (ok) n++;
    });
    contador.textContent = n === 1 ? "1 lead" : n + " leads";
    vazio.classList.toggle("is-on", n === 0);
    tabela.parentNode.style.display = n === 0 ? "none" : "";
  }
  [fStatus, fServico, fMin].forEach(function (el) { el.addEventListener("change", filtrar); });
  fBusca.addEventListener("input", filtrar);
  document.getElementById("limpar").addEventListener("click", function () { fStatus.value = ""; fServico.value = ""; fMin.value = "0"; fBusca.value = ""; filtrar(); fBusca.focus(); });
  filtrar();
});
