<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de post — Painel V8 Studio</title>
<meta name="description" content="Editor de posts do blog do V8 Studio com pré-visualização em Markdown.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/styles.css">
<style>
/* Layout comum do painel */
.admin__side .logo { padding: 4px 10px; }
.admin__nav { display: grid; gap: 4px; }
.admin__nav a svg { flex: 0 0 auto; }
.admin__nav hr { border: 0; height: 1px; background: var(--color-line); margin: 10px 14px; }
.admin__top h1 { font-size: 36px; }
.admin__top .row { gap: 12px; }
.admin .card h3 { font-size: 22px; margin-bottom: 18px; }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.card__head h3 { margin-bottom: 0 !important; }
.admin .card--flush { padding: 0; }
.admin .card--flush .card__head { padding: 24px 32px 0; margin-bottom: 8px; }
.card--flush .table-wrap { box-shadow: none; border-radius: 0; }
.g8 { grid-column: span 8; } .g4 { grid-column: span 4; } .g6 { grid-column: span 6; } .g12 { grid-column: 1 / -1; }
.notice { display: none; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--color-ok); font-weight: 500; }
.notice.is-on { display: inline-flex; }
.notice::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); }
.link { color: var(--color-blue); font-weight: 600; }
.link:hover { text-decoration: underline; }
@media (max-width: 1024px) {
  .admin__side { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
  .admin__nav { flex: 1 0 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .admin__nav::-webkit-scrollbar { display: none; }
  .admin__nav a { padding: 8px 12px; white-space: nowrap; font-size: var(--text-xs); }
  .admin__nav hr { display: none; }
  .admin__top h1 { font-size: 30px; }
  .g8, .g4, .g6 { grid-column: 1 / -1; }
  .admin .card--flush .card__head { padding: 22px 24px 0; }
}
@media (max-width: 720px) { .admin .card { padding: 24px; } .kpis { gap: 16px; } .kpi { padding: 22px 24px; } .kpi .stat__n { font-size: 40px; } }
.post-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: var(--gutter); }
.post-top .field { flex: 1 1 320px; }
.post-top input { height: 64px; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; }
.post-top .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gutter); margin-bottom: var(--gutter); }
.editor .card { padding: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.editor .card__head { padding: 18px 24px; margin: 0; border-bottom: 1px solid var(--color-line); }
.editor .card__head h3 { font-size: var(--text-sm); color: var(--color-gray); font-weight: 600; font-family: var(--font-body); letter-spacing: 0; }
.editor textarea { width: 100%; height: 560px; padding: 24px; border: 0; resize: vertical; font-family: var(--font-body); font-size: var(--text-sm); line-height: 1.65; background: var(--color-white); display: block; }
.editor textarea:focus { outline: none; }
.preview { height: 560px; overflow-y: auto; padding: 24px 28px; font-size: var(--text-sm); line-height: 1.65; }
.preview h1 { font-size: 30px; margin: 0 0 16px; } .preview h2 { font-size: 24px; margin: 28px 0 10px; } .preview h3 { font-size: 19px; margin: 22px 0 8px; }
.preview p { margin: 0 0 14px; color: var(--color-ink); } .preview ul { list-style: disc; padding-left: 22px; margin: 0 0 14px; display: grid; gap: 6px; }
.preview blockquote { margin: 18px 0; padding: 4px 0 4px 18px; border-left: 3px solid var(--color-blue); color: var(--color-gray); }
.preview code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--color-paper); padding: 2px 6px; border-radius: 6px; }
.preview a { color: var(--color-blue); font-weight: 600; } .preview strong { font-weight: 600; }
.seo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px var(--gutter); }
.seo-grid .g12 { grid-column: 1 / -1; }
.seo-grid textarea { min-height: 96px; }
.readtime { display: grid; gap: 8px; }
.readtime .box { height: 56px; display: flex; align-items: center; padding-inline: 20px; border-radius: 16px; background: var(--color-paper); font-weight: 500; }
@media (max-width: 1024px) { .editor, .seo-grid { grid-template-columns: 1fr; } .editor textarea, .preview { height: 420px; } }
@media (max-width: 720px) { .post-top input { font-size: 20px; height: 56px; } }
</style>
</head>
<body class="no-header">
<div class="admin">
<aside class="admin__side">
  <a class="logo" href="index.html" aria-label="V8 Studio, painel"></a>
  <nav class="admin__nav" aria-label="Painel">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Visão geral</span></a>
    <a href="leads.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5c2 .8 3 2.6 3 5.5"/></svg><span>Leads</span></a>
    <a href="post.html" class="is-active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span>Posts</span></a>
    <a href="config.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M18.5 7H20M4 17h3.5M12.5 17H20"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg><span>Configurações</span></a>
    <hr>
    <a href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span>Ver site</span></a>
  </nav>
</aside>
<main class="admin__main">
<div class="admin__top">
  <div class="row"><h1>Editor de post</h1></div>
  <div class="admin__user"><i>R</i><span>Rodrigo Vale</span></div>
</div>
  <div class="post-top">
    <div class="field"><label class="visually-hidden" for="titulo">Título</label><input id="titulo" type="text" placeholder="Título do post" value="Quanto custa um site profissional em 2026"></div>
    <div class="actions">
      <span class="notice" id="aviso" role="status" aria-live="polite"></span>
      <button class="btn btn--ghost btn--sm" type="button" id="salvar">Salvar rascunho</button>
      <button class="btn btn--primary btn--sm" type="button" id="publicar">Publicar</button>
    </div>
  </div>
  <div class="editor">
    <div class="card">
      <div class="card__head"><h3>Markdown</h3></div>
      <label class="visually-hidden" for="md">Conteúdo em Markdown</label>
      <textarea id="md" spellcheck="false"></textarea>
    </div>
    <div class="card">
      <div class="card__head"><h3>Pré-visualização</h3></div>
      <div class="preview" id="preview"></div>
    </div>
  </div>
  <form class="card" data-demo id="form-seo">
    <h3>SEO</h3>
    <div class="seo-grid">
      <div class="field"><label for="seo-titulo">Título SEO</label><input id="seo-titulo" type="text" maxlength="90" value="Quanto custa um site profissional em 2026 | V8 Studio"><div class="field__hint"><span>Aparece na aba e no Google</span><span id="c-titulo">0/60</span></div></div>
      <div class="field"><label for="slug">Slug</label><input id="slug" type="text"><div class="field__hint"><span>v8studio.com.br/blog/<span id="slug-preview"></span></span></div></div>
      <div class="field g12"><label for="seo-desc">Descrição</label><textarea id="seo-desc" maxlength="240">Faixas reais de investimento para site institucional, landing page e loja virtual em 2026, o que define o preço e o que vem incluso em um projeto do V8 Studio.</textarea><div class="field__hint"><span>Resumo exibido nos resultados de busca</span><span id="c-desc">0/160</span></div></div>
      <div class="field"><label for="categoria">Categoria</label><select id="categoria"><option>Orçamento</option><option>Sites</option><option>Landing pages</option><option>Lojas virtuais</option><option>Sistemas</option><option>Aplicativos</option><option>Bastidores</option></select></div>
      <div class="readtime"><span class="field"><label>Tempo de leitura</label></span><div class="box" id="tempo">0 min</div></div>
    </div>
  </form>
</main>
</div>
<script src="../assets/app.js" data-root="../" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  document.querySelectorAll("a.logo").forEach(function (a) { a.innerHTML = window.V8.logoSvg("", null) + "<span>Studio</span>"; });
  var md = document.getElementById("md"), preview = document.getElementById("preview");
  md.value = "# Quanto custa um site profissional em 2026\n\nEssa é a pergunta que mais chega no nosso formulário. A resposta curta: **entre R$ 8 mil e R$ 60 mil**, dependendo do que o site precisa fazer. A resposta longa está abaixo, sem rodeios.\n\n## O que define o preço\n\nUm site não é um produto de prateleira. O valor muda com três coisas:\n\n- **Páginas e conteúdo**: um site institucional com cinco páginas custa menos do que um portal com blog, catálogo e área do cliente.\n- **Integrações**: agendamento, pagamento, CRM e automações pedem mais horas de desenvolvimento e testes.\n- **Design sob medida**: layout desenhado para a sua marca, e não um tema adaptado, é o que faz o site passar credibilidade.\n\n## Faixas de investimento que praticamos\n\n### Site institucional\n\nDe *R$ 8 mil a R$ 15 mil*. Até oito páginas, formulário de contato, blog simples e otimização para o Google. Entrega em 3 a 5 semanas.\n\n### Landing page de alta conversão\n\nDe *R$ 6 mil a R$ 12 mil*. Uma página, um objetivo, testes de versão e integração com a ferramenta de e-mail. Entrega em 2 a 3 semanas.\n\n### Loja virtual\n\nDe *R$ 30 mil a R$ 60 mil*. Catálogo, pagamento, frete, painel de pedidos e integração com estoque. Entrega em 8 a 12 semanas.\n\n> Um site barato que não gera contato custa mais caro do que um site bem feito que gera.\n\n## O que está incluso\n\nTodo projeto do V8 Studio sai com domínio configurado, certificado de segurança, hospedagem no primeiro ano e treinamento de uma hora para a equipe editar textos. Também entregamos o código em um repositório seu, para que você nunca fique preso a ninguém.\n\n## Como pedir um orçamento\n\nResponda o nosso formulário em [v8studio.com.br/comecar](../comecar.html). São sete perguntas e leva menos de dois minutos. Com as respostas, montamos uma proposta com escopo fechado e prazo real, sem taxa escondida como `manutenção obrigatória`.";

  /* Conversor Markdown mínimo: escapa HTML antes de qualquer marcação. */
  function inline(t) {
    t = t.replace(/`([^`]+)`/g, function (m, c) { return "<code>" + c + "</code>"; });
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, url) { return /^(https?:\/\/|\.{0,2}\/|#)/.test(url) ? "<a href=\"" + url + "\">" + txt + "</a>" : m; });
    return t;
  }
  function markdown(src) {
    var lines = esc(src).split(/\r?\n/), out = [], para = [], list = [], quote = [];
    function flush() {
      if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
      if (list.length) { out.push("<ul>" + list.map(function (i) { return "<li>" + inline(i) + "</li>"; }).join("") + "</ul>"); list = []; }
      if (quote.length) { out.push("<blockquote><p>" + inline(quote.join(" ")) + "</p></blockquote>"); quote = []; }
    }
    lines.forEach(function (ln) {
      var h = ln.match(/^(#{1,3})\s+(.+)$/);
      if (h) { flush(); out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); return; }
      if (/^-\s+/.test(ln)) { if (para.length || quote.length) flush(); list.push(ln.replace(/^-\s+/, "")); return; }
      if (/^&gt;\s?/.test(ln)) { if (para.length || list.length) flush(); quote.push(ln.replace(/^&gt;\s?/, "")); return; }
      if (!ln.trim()) { flush(); return; }
      if (list.length || quote.length) flush();
      para.push(ln.trim());
    });
    flush();
    return out.join("\n");
  }

  var titulo = document.getElementById("titulo"), slug = document.getElementById("slug"), slugPrev = document.getElementById("slug-preview"), tempo = document.getElementById("tempo");
  var seoTitulo = document.getElementById("seo-titulo"), seoDesc = document.getElementById("seo-desc"), cTitulo = document.getElementById("c-titulo"), cDesc = document.getElementById("c-desc");
  var slugTocado = false;
  function slugify(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  function render() {
    preview.innerHTML = markdown(md.value);
    var palavras = md.value.trim().split(/\s+/).filter(Boolean).length;
    tempo.textContent = Math.max(1, Math.ceil(palavras / 200)) + " min de leitura (" + palavras + " palavras)";
  }
  function contar(el, out, max) { var n = el.value.length; out.textContent = n + "/" + max; out.classList.toggle("over", n > max); }
  function atualizarSlug() { if (!slugTocado) slug.value = slugify(titulo.value); slugPrev.textContent = slug.value; }
  md.addEventListener("input", render);
  titulo.addEventListener("input", atualizarSlug);
  slug.addEventListener("input", function () { slugTocado = slug.value.trim() !== ""; slugPrev.textContent = slug.value; });
  seoTitulo.addEventListener("input", function () { contar(seoTitulo, cTitulo, 60); });
  seoDesc.addEventListener("input", function () { contar(seoDesc, cDesc, 160); });
  render(); atualizarSlug(); contar(seoTitulo, cTitulo, 60); contar(seoDesc, cDesc, 160);

  var aviso = document.getElementById("aviso");
  function hora() { var d = new Date(); return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes(); }
  document.getElementById("salvar").addEventListener("click", function () { aviso.textContent = "Rascunho salvo às " + hora(); aviso.classList.add("is-on"); });
  document.getElementById("publicar").addEventListener("click", function () { aviso.textContent = "Publicado"; aviso.classList.add("is-on"); });
});
</script>
</body>
</html>
